server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # La API Flask queda detrás de /api (mismo origen: no hace falta CORS)
  location /api/ {
    proxy_pass http://api_bienestar:5001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA: React Router resuelve las rutas en el cliente
  location / {
    try_files $uri $uri/ /index.html;
  }
}
