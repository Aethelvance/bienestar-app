services:
  api_bienestar:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

  web_bienestar:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api_bienestar
